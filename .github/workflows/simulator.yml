name: Simulator Screenshots

on:
  workflow_dispatch:
  push:
    branches:
      - claude/hopeful-allen-md1li0

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project Pillars.xcodeproj \
            -scheme Pillars \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build.log || true
          echo "==================== compiler errors ===================="
          grep -nE "error:" build.log | head -80 || echo "(no error: lines found)"
          echo "========================================================="
          if grep -q "BUILD FAILED" build.log; then echo "Build failed"; exit 65; fi

      - name: Boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; xs=[x for v in d.values() for x in v if 'iPhone' in x['name']]; pref=[x for x in xs if '16' in x['name']] or [x for x in xs if '15' in x['name']] or xs; print(pref[0]['udid'])")
          echo "Using simulator $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Install app
        run: |
          APP=$(find build/Build/Products -maxdepth 3 -name 'Pillars.app' | head -1)
          echo "App bundle: $APP"
          xcrun simctl install "$UDID" "$APP"

      - name: Capture screenshots
        run: |
          mkdir -p screenshots
          shoot () {
            xcrun simctl terminate "$UDID" com.pillars.app >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" com.pillars.app $2 >/dev/null 2>&1 || true
            sleep 6
            xcrun simctl io "$UDID" screenshot "screenshots/$1.png"
            echo "captured $1"
          }
          # Every page, in roughly app-flow order. Tabs use --screen (tab bar visible);
          # deeper pages use --route (rendered directly via CaptureRoot).
          shoot 00_launch         "--uitest --route launch"
          shoot 01_welcome        "--uitest --route welcome"
          shoot 02_philosophy     "--uitest --route philosophy"
          shoot 03_baseline       "--uitest --route baseline"
          shoot 03b_reveal        "--uitest --route reveal"
          shoot 04_today          "--uitest --screen today"
          shoot 05_daily_checkin  "--uitest --route checkin"
          shoot 06_weekly_review  "--uitest --route weekly"
          shoot 07_history        "--uitest --route history"
          shoot 08_pillar_map     "--uitest --screen map"
          shoot 09_pillar_detail  "--uitest --route pillardetail"
          shoot 10_moves          "--uitest --screen moves"
          shoot 11_ritual_library "--uitest --route rituals"
          shoot 12_ritual_detail  "--uitest --route ritualdetail"
          shoot 13_circle         "--uitest --screen circle"
          shoot 14_privacy        "--uitest --route privacy"
          shoot 15_share_win      "--uitest --route sharedwin"
          shoot 16_shared_reset   "--uitest --route sharedreset"
          shoot 17_paywall        "--uitest --route paywall"
          shoot 18_settings       "--uitest --screen settings"
          ls -la screenshots

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pillars-simulator-screenshots
          path: |
            screenshots/**
            build.log
          if-no-files-found: warn

      - name: Publish screenshots to ci-simulator-shots branch
        if: success()
        run: |
          mkdir -p /tmp/shots
          cp screenshots/*.png /tmp/shots/ 2>/dev/null || true
          cd /tmp/shots
          git init -q
          git checkout -q -b ci-simulator-shots
          git add -A
          git -c user.name="pillars-ci" -c user.email="ci@pillars.local" \
            commit -q -m "Simulator screenshots for ${GITHUB_SHA}" || { echo "nothing to publish"; exit 0; }
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            HEAD:refs/heads/ci-simulator-shots
