name: Unit Tests

on:
  workflow_dispatch:
  push:
    branches:
      - claude/hopeful-allen-md1li0

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Pick and boot a simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; xs=[x for v in d.values() for x in v if 'iPhone' in x['name']]; pref=[x for x in xs if '16' in x['name']] or [x for x in xs if '15' in x['name']] or xs; print(pref[0]['udid'])")
          echo "Using simulator $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Pillars.xcodeproj \
            -scheme Pillars \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$UDID" \
            -derivedDataPath build-tests \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee test.log

      - name: Test summary
        if: always()
        run: |
          echo "==================== test summary ===================="
          grep -nE "Test Suite .*(passed|failed)|Executed [0-9]+ test|error:|TEST (SUCCEEDED|FAILED)" test.log | tail -50 || echo "(no summary lines)"
          echo "====================================================="

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pillars-test-log
          path: test.log
          if-no-files-found: warn
